<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10131a" />
    <title>GNOC Suite — Snake Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="dashboard" aria-label="Snake Game">
        <header class="dashboard-header">
          <div class="dashboard-header-top">
            <div>
              <p class="eyebrow">GNOC SUITE / 05</p>
              <h1 class="dashboard-title">Snake Game</h1>
              <p class="dashboard-desc">
                Use the arrow keys to move the snake and eat the food. Avoid hitting the walls or your own tail.
              </p>
            </div>
            <nav class="tool-nav" aria-label="Tools">
              <a href="index.html">Home</a>
            </nav>
          </div>
        </header>

        <div class="game-container">
          <canvas id="snakeCanvas" width="400" height="400"></canvas>
          <div class="score-panel">
            <span>Score: <span id="score">0</span></span>
            <button id="restartBtn">Restart</button>
          </div>
        </div>
      </section>
    </main>

    <script src="snake.js"></script>
  </body>
</html>
